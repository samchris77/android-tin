<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinnitusTracker — Home Prototype (Light Theme)</title>
<style>
  :root {
    /* Mirrors component-gallery.html / ui/theme/Color.kt — light palette */
    --bg: #F5F1EA;
    --surface: #FFFFFF;
    --ink: #1A2E2C;
    --ink-2: #4A5C5A;
    --muted: #8B9694;
    --line: #E5DED2;

    --teal: #2D5F5D;
    --teal-2: #3E7A77;
    --teal-soft: #E8F0EE;

    --coral: #D67C5C;
    --coral-soft: #F8E4D9;

    --warn: #C44536;
    --warn-soft: #F7DDD8;

    --r-card: 16px;
    --r-chip: 8px;
    --r-button: 12px;
    --r-pill: 100px;

    --shadow-card: 0 2px 6px rgba(26, 46, 44, 0.04), 0 8px 24px rgba(26, 46, 44, 0.06);
    --shadow-raised: 0 4px 12px rgba(26, 46, 44, 0.08);
    --shadow-hero: 0 8px 24px rgba(45, 95, 93, 0.20);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #E5DED2; /* Outer background to show the device frame clearly */
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  /* Mobile Phone Container */
  .device {
    width: 390px;
    height: 844px;
    background-color: var(--bg);
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.2);
    border: 8px solid #ffffff;
    display: flex;
    flex-direction: column;
  }

  .content {
    flex: 1;
    padding: 40px 20px 24px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  /* --- Components from Gallery --- */
  
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-card);
    padding: 16px;
    box-shadow: var(--shadow-card);
  }
  .card.tinted { background: var(--teal-soft); border: none; }
  .card.coral { background: var(--coral-soft); border: none; }
  
  .card h4 {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); margin-bottom: 8px;
  }
  
  .icon-badge {
    width: 36px; height: 36px; border-radius: var(--r-chip);
    background: var(--teal-soft); color: var(--teal);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px;
  }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: var(--r-pill);
    font-size: 11px; font-weight: 600;
  }
  .pill-coral { background: var(--coral-soft); color: var(--coral); }

  /* --- Specific Page Layout --- */

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: var(--ink); margin-bottom: 4px;}
  header p { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px;}

  /* Hero Player */
  .hero-player {
    display: flex; flex-direction: column; align-items: center; 
    padding: 32px 24px; margin-bottom: 16px;
    position: relative; overflow: hidden;
  }

  .hero-player::before {
    content: '';
    position: absolute;
    top: -50px; left: -50px; right: -50px; height: 200px;
    background: radial-gradient(circle at top right, rgba(214, 124, 92, 0.15), transparent 70%);
    z-index: 0;
  }

  .play-ring-container {
    width: 140px; height: 140px; position: relative; margin-bottom: 24px; z-index: 1;
  }

  .progress-ring {
    transform: rotate(-90deg); position: absolute; top:0; left:0; width: 100%; height: 100%;
  }

  .play-btn {
    width: 100px; height: 100px; border-radius: 50%; 
    background: var(--teal); border: none; 
    position: absolute; top: 20px; left: 20px; 
    box-shadow: var(--shadow-raised); 
    display: flex; justify-content: center; align-items: center; 
    cursor: pointer; transition: transform 0.2s ease;
  }

  .play-btn:active {
    transform: scale(0.96);
    background: var(--teal-2);
  }

  .hero-info {
    text-align: center; z-index: 1;
  }

  /* Adherence Card */
  .adherence-card {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  
  .adherence-bar-bg {
    width: 100px; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden;
  }
  .adherence-bar-fill {
    width: 70%; height: 100%; background: var(--teal); border-radius: 3px;
  }

  /* Action Grid */
  .action-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px;
  }

  .action-btn {
    display: flex; flex-direction: column; align-items: flex-start; gap: 12px; 
    cursor: pointer; transition: transform 0.2s;
  }
  
  .action-btn:active { transform: scale(0.98); }

  /* Bottom Nav */
  .bottom-nav {
    height: 64px;
    background: var(--surface);
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-around; align-items: center;
    padding-bottom: 8px; /* Safe area */
  }

  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--muted); font-size: 10px; font-weight: 500;
  }

  .nav-item.active { color: var(--teal); }

  .nav-icon {
    width: 24px; height: 24px;
  }
</style>
</head>
<body>

  <div class="device">
    <div class="content">
      
      <!-- Header -->
      <header>
        <div>
          <h1>안녕하세요</h1>
          <p>치료 3주차 <span class="pill pill-coral">🔥 5일 연속</span></p>
        </div>
        <div class="icon-badge" style="background: var(--surface); border: 1px solid var(--line); border-radius: 50%; color: var(--ink-2);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </div>
      </header>

      <!-- Hero Player -->
      <div class="card tinted hero-player">
        <div class="play-ring-container">
          <svg class="progress-ring" viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="66" fill="none" stroke="var(--surface)" stroke-width="6" />
            <circle cx="70" cy="70" r="66" fill="none" stroke="var(--teal)" stroke-width="6" stroke-dasharray="414" stroke-dashoffset="124" stroke-linecap="round" />
          </svg>
          <button class="play-btn">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="white" style="margin-left: 4px;"><path d="M8 5v14l11-7z"/></svg>
          </button>
        </div>
        
        <div class="hero-info">
          <div style="font-size: 11px; font-weight: 600; color: var(--teal); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px;">현재 프리셋</div>
          <h2 style="font-size: 24px; font-weight: 700; color: var(--ink); margin-bottom: 4px; letter-spacing: -0.5px;">저녁 휴식</h2>
          <p style="font-size: 13px; color: var(--ink-2);">노치 · 핑크 노이즈 · 빗소리</p>
        </div>
      </div>

      <!-- Adherence -->
      <div class="card adherence-card">
        <div>
          <h4>오늘의 청취 달성률</h4>
          <div style="font-size: 20px; font-weight: 700; color: var(--ink); letter-spacing: -0.5px;">84 <span style="font-size: 13px; color: var(--muted); font-weight: 400;">/ 120 분</span></div>
        </div>
        <div class="adherence-bar-bg">
          <div class="adherence-bar-fill"></div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="action-grid">
        <div class="card action-btn">
          <div class="icon-badge" style="background: var(--bg); color: var(--ink); border: 1px solid var(--line);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          </div>
          <div>
            <div style="font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 2px;">수면 타이머</div>
            <div style="font-size: 12px; color: var(--muted);">꺼짐</div>
          </div>
        </div>
        <div class="card coral action-btn">
          <div class="icon-badge" style="background: var(--surface); color: var(--coral); box-shadow: 0 2px 4px rgba(214, 124, 92, 0.1);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          </div>
          <div>
            <div style="font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 2px;">상태 기록</div>
            <div style="font-size: 12px; color: var(--coral);">지금 이명은?</div>
          </div>
        </div>
      </div>

    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <div class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>홈</span>
      </div>
      <div class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        <span>소리</span>
      </div>
      <div class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span>기록</span>
      </div>
    </div>
  </div>

</body>
</html>
